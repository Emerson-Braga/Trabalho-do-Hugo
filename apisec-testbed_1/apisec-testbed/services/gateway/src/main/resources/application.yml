server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://keycloak:8080/realms/apisec}
          jwk-set-uri: ${KEYCLOAK_JWKS:http://keycloak:8080/realms/apisec/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: target-service
          uri: ${TARGET_URI:http://target-service:8081}
          predicates:
            - Path=/api/**,/actuator/**,/v3/api-docs/**,/swagger-ui/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_RPS:50}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:100}

gateway:
  # variavel independente: estrategia "API Gateway + OAuth2/JWT" ligada ou desligada
  enforce-jwt: ${GATEWAY_ENFORCE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: gateway
